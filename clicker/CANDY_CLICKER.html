<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Candy Clicker</title>
    <style>
        @keyframes fadeOut {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-20px); }
        }
        .pop-animation {
            display: inline-block;
            color: #ff4757;
            font-weight: bold;
            animation: fadeOut 0.8s forwards;
        }
    </style>
</head>
<body>
    <h1>Bienvenue sur CANDY CLICKER !</h1>
    <h2>Le jeu de clic endiablé !</h2>
    <hr>
    <div id="output">Vous avez 0 candy !</div>
    <br>
    <input id="starter" type="button" value="Cliquer-moi !" />

    <hr>
    <h3>Boutique des Conforts</h3>
    <button id="buy-release" disabled>Débloquer "Point au relâchement" (Coût : 100 🍬)</button>
    <br><br>
    <button id="buy-enter" disabled>Débloquer "Point à l'entrée du bouton" (Coût : 50 🍬)</button>
    <br><br>
    <button id="buy-leave" disabled>Débloquer "Point à la sortie du bouton" (Coût : 50 🍬)</button>
    <br><br>
    <button id="buy-hold" disabled>Débloquer "Pression Prolongée" (Coût : 200 🍬)</button>
    <br><br>
    <button id="buy-move" disabled>Débloquer "Survol Turbo" (Coût : 400 🍬)</button>
    <br><br>
    <button id="buy-auto" disabled>Débloquer "Auto-Clicker Passif" (Coût : 800 🍬)</button>
    <script src="CANDY_CLICKER.js"></script>
</body>
</html>
